[package]
name = "komainu"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = "1.0"
bollard = "0.18"
libc = "0.2"
uuid = { version = "1", default-features = false, features = ["v4", "serde"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ring = "0.17"
time = "0.3"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
http-body = "1.0"
bytes = "1"
passkey-auth = "0.1.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
